<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortGuard Safety Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Introduction & Entry Screen Layout */
        #portal-intro {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 40px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #475569;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #portal-intro h1 {
            color: #fb923c;
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        #portal-intro h2 {
            color: #34d399;
            margin: 0 0 25px 0;
            font-size: 1.2rem;
            font-weight: 500;
        }

        #portal-intro p {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 0 35px 0;
        }

        /* Action Entry Button */
        #enter-btn {
            background: #fb923c;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 146, 60, 0.3);
            transition: all 0.2s ease;
        }

        #enter-btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 146, 60, 0.4);
        }

        /* Full Screen Form Container Setup */
        #form-container {
            display: none; /* Hidden on load */
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            background-color: #1e293b;
        }

        #form-header {
            width: 100%;
            background-color: #0f172a;
            border-bottom: 2px solid #334155;
            padding: 15px 25px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #form-header h3 {
            margin: 0;
            color: #34d399;
            font-size: 1.2rem;
        }

        #back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #back-btn:hover {
            background: #dc2626;
        }

        /* Iframe Canvas Mounting Space */
        .iframe-wrapper {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            background-color: #1e293b;
            overflow-y: auto;
            padding: 20px 0;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            max-width: 680px;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- 1. Introduction Screen -->
    <div id="portal-intro">
        <h1>FortGuard Portal</h1>
        <h2>Systemic Safety & Harassment Report</h2>
        <p>
            Welcome to the official intake network. Click below to securely load and fill out the active player assessment file regarding incidents against Epic Games.
        </p>
        <button id="enter-btn">ENTER THE PORTAL</button>
    </div>

    <!-- 2. Pure Form Display Space -->
    <div id="form-container">
        <div id="form-header">
            <h3>FortGuard Intake System Active</h3>
            <button id="back-btn">Exit Interface ✕</button>
        </div>
        <div class="iframe-wrapper">
            <!-- Exact Google Form Frame Connection Provided -->
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScnHIx9XNjzWPHDUGfwPqJoC4DdoUjrgSW7mduBRxtkQzIYpw/viewform?embedded=true">
                Loading Secure File Matrix...
            </iframe>
        </div>
    </div>

    <script>
        const introScreen = document.getElementById('portal-intro');
        const formContainer = document.getElementById('form-container');
        const enterBtn = document.getElementById('enter-btn');
        const backBtn = document.getElementById('back-btn');

        // Logic to instantly reveal the form and clear out initial headers
        enterBtn.addEventListener('click', () => {
            introScreen.style.display = 'none';
            formContainer.style.display = 'flex';
        });

        // Clean toggle reset loop back if they hit exit
        backBtn.addEventListener('click', () => {
            formContainer.style.display = 'none';
            introScreen.style.display = 'flex';
        });
    </script>
</body>
</html>
